name: Local VM Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: [self-hosted, local-vm-arm64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-flight inventory
        run: |
          echo "=== uname ===" ; uname -a
          echo "=== own cgroup ===" ; cat /proc/self/cgroup
          echo "=== Runner.* processes ==="
          pgrep -af 'Runner\.' || true
          echo "=== systemd version ===" ; systemctl --version | head -1

      - name: Prepare trace dir
        run: sudo mkdir -p /var/log/symbiote && sudo chown $USER /var/log/symbiote

      - name: Install Nix (if missing)
        run: |
          # Source the daemon profile first — nix lives in /nix/var/nix/profiles/default/bin
          # which isn't in a self-hosted runner's PATH unless explicitly sourced.
          [ -f /etc/profile.d/nix.sh ] && . /etc/profile.d/nix.sh
          if command -v nix >/dev/null; then
            echo "nix already installed at $(command -v nix)"
            nix --version
            exit 0
          fi
          # Clean stale backups from any previously-aborted install so the
          # installer doesn't bail with "backup already exists".
          sudo rm -f /etc/bash.bashrc.backup-before-nix /etc/zshrc.backup-before-nix \
                     /etc/profile.backup-before-nix /etc/zsh/zshrc.backup-before-nix
          curl -sSL -o /tmp/nix-installer.sh https://nixos.org/nix/install
          sh /tmp/nix-installer.sh --daemon --yes
          sudo mkdir -p /etc/nix
          echo "experimental-features = nix-command flakes" | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon
          . /etc/profile.d/nix.sh
          nix --version

      - name: Build + invoke activator
        timeout-minutes: 8
        run: |
          . /etc/profile.d/nix.sh
          nix --extra-experimental-features 'nix-command flakes' build --accept-flake-config .#linux-arm64
          cp result/bin/nixos-symbiote ./nixos-symbiote
          ./nixos-symbiote --version
          sudo tail -F -n 0 /var/log/symbiote/trace.log &
          TAIL_PID=$!
          trap "sudo kill $TAIL_PID 2>/dev/null || true" EXIT
          sudo ./nixos-symbiote --config test/configuration-minimal.nix
