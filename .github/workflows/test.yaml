name: Test NixOS Symbiote

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            flake-attr: linux-amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            flake-attr: linux-arm64
          # riscv64 test lane DISABLED — permanently, not a capacity issue.
          # The RISE RISC-V runner runs the job inside a Kubernetes pod /
          # containerd container (PID 1 = docker-init/tini, no systemd), and
          # the soft-reboot pivot needs systemd + kernel control. The riscv64
          # BINARY still ships, cross-compiled on amd64/arm64 (release.yml).
          # - runner: ubuntu-24.04-riscv
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          extra_nix_config: |
            extra-substituters = s3://nixos-symbiote?endpoint=e07b6927af7f0bcd485d715838df45ba.r2.cloudflarestorage.com&region=auto
            extra-trusted-public-keys = nixos-symbiote-2:04hzKpsfZ75z6MW8kpALD2gfLuCdnP5fbGdyjHNbsCM=

      - name: Build symbiote binary
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          nix build --accept-flake-config .#${{ matrix.flake-attr }}
          cp result/bin/nixos-symbiote ./nixos-symbiote
          chmod +x ./nixos-symbiote
          ./nixos-symbiote --version

      - name: Push build to R2 cache
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          NIX_CACHE_PRIV_KEY: ${{ secrets.NIX_CACHE_PRIV_KEY }}
        run: |
          echo "$NIX_CACHE_PRIV_KEY" > /tmp/cache-priv.key
          nix store sign --key-file /tmp/cache-priv.key --recursive ./result
          nix copy --to "s3://nixos-symbiote?endpoint=e07b6927af7f0bcd485d715838df45ba.r2.cloudflarestorage.com&region=auto" ./result
          rm -f /tmp/cache-priv.key

      - name: Invoke activator (pivot to NixOS)
        timeout-minutes: 5
        # The symbiote is a static binary. It performs the soft-reboot pivot and
        # streams its OWN trace two ways: to stdout (captured here in the step
        # log) and to SYMBIOTE_LOG_SINK — a static TCP sink that survives the
        # pivot. This replaces the old shell systemd-run forwarder/watchdog
        # units, which depended on tail/journalctl/logger (gone post-pivot),
        # failed, and drove the pivoted system `degraded`.
        env:
          SYMBIOTE_LOG_SINK: ${{ secrets.SYSLOG_HOST }}:${{ secrets.SYSLOG_PORT }}
          SYMBIOTE_LOG_TAG: SYMB-${{ github.run_id }}-${{ matrix.arch }}
        run: |
          echo "::add-mask::${{ secrets.SYSLOG_HOST }}"
          sudo --preserve-env=SYMBIOTE_LOG_SINK,SYMBIOTE_LOG_TAG \
            ./nixos-symbiote --config test/configuration-minimal.nix
          echo "=== activator exit=$? ==="

      - name: Verify NixOS + smoke tests
        run: |
          # Post-pivot the userland is NixOS; coreutils/etc. resolve via the
          # FHS compatibility layer (see system.nix). The symbiote only returns
          # after systemd reports `running`, so no polling needed here.
          osid=$(sed -n 's/^ID=//p' /etc/os-release)
          echo "OS=$osid  KERNEL=$(uname -r)"
          test "$osid" = nixos
          # Test 1: a plain NixOS binary runs post-pivot.
          hello
          # Proof-of-pivot panel: OS NixOS on the retained host kernel.
          fastfetch || /run/current-system/sw/bin/fastfetch

      - name: Post-reboot diagnostics (on failure)
        if: failure()
        run: |
          # Static reads first (never hang), then a bounded systemctl.
          cat /etc/os-release 2>&1 || echo "(no /etc/os-release)"
          cat /proc/1/comm 2>/dev/null; readlink /proc/1/exe 2>/dev/null
          readlink /run/current-system 2>/dev/null || echo "(no current-system)"
          sudo dmesg --nopager 2>/dev/null | tail -60 || true
          timeout 10 sudo systemctl --failed --no-pager 2>&1 || true
          timeout 10 sudo systemctl status --no-pager -n0 2>&1 | head -20 || true
