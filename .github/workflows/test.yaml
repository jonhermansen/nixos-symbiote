name: Test NixOS Symbiote

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            flake-attr: linux-amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            flake-attr: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-flight runner inventory (streamed)
        run: |
          echo "=== all Runner.* / Actions processes ==="
          sudo ps -eo pid,ppid,user,comm,args | grep -i -E 'runner|action' | grep -v grep || true
          echo "=== cgroup for each Runner.Listener / Runner.Worker ==="
          for pid in $(pgrep -f 'Runner\.(Listener|Worker)' || true); do
            echo "--- pid=$pid ---"
            sudo cat /proc/$pid/cgroup 2>/dev/null || echo "<gone>"
            sudo tr '\0' ' ' < /proc/$pid/cmdline 2>/dev/null; echo
          done
          echo "=== own cgroup ==="
          cat /proc/self/cgroup
          echo "=== all .scope units ==="
          systemctl list-units --type=scope --no-pager --all || true

      - name: Prepare persistent trace dir
        run: |
          sudo mkdir -p /var/log/symbiote
          sudo chmod 755 /var/log/symbiote
          : | sudo tee /var/log/symbiote/trace.log /var/log/symbiote/watchdog.log /var/log/symbiote/journal.log > /dev/null
          echo "boot=$(date -u +%s) runner=${{ matrix.runner }}" | sudo tee /var/log/symbiote/boot-id

      - name: Start protected watchdog (writes to disk)
        run: |
          sudo systemd-run --unit=symbiote-watchdog \
            --property=DefaultDependencies=no \
            --property=IgnoreOnIsolate=yes \
            --property=SurviveFinalKillSignal=yes \
            bash -c '
              exec >> /var/log/symbiote/watchdog.log 2>&1
              while true; do
                ts=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)
                state=$(timeout 2 systemctl is-system-running 2>&1 || echo UNREACHABLE)
                nixos=$(test -f /etc/NIXOS && echo yes || echo no)
                osid=$(sed -n "s/^ID=//p" /etc/os-release 2>/dev/null || echo unknown)
                runners=$(pgrep -f "Runner\.(Listener|Worker)" | tr "\n" " ")
                echo "WD $ts state=$state nixos=$nixos os=$osid runners=[$runners]"
                sleep 1
              done
            '

      - name: Start protected journal logger
        run: |
          sudo systemd-run --unit=journal-logger \
            --property=DefaultDependencies=no \
            --property=IgnoreOnIsolate=yes \
            --property=SurviveFinalKillSignal=yes \
            bash -c 'journalctl -f -o short-monotonic --no-pager >> /var/log/symbiote/journal.log 2>&1'

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          extra_nix_config: |
            extra-substituters = s3://nixos-symbiote?endpoint=${{ secrets.R2_ENDPOINT }}&region=auto
            extra-trusted-public-keys = nixos-symbiote-2:04hzKpsfZ75z6MW8kpALD2gfLuCdnP5fbGdyjHNbsCM=

      - name: Build symbiote binary
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          nix build .#${{ matrix.flake-attr }}
          cp result/bin/nixos-symbiote ./nixos-symbiote
          chmod +x ./nixos-symbiote
          ./nixos-symbiote --version
          file ./nixos-symbiote

      - name: Push build to R2 cache
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          NIX_CACHE_PRIV_KEY: ${{ secrets.NIX_CACHE_PRIV_KEY }}
        run: |
          echo "$NIX_CACHE_PRIV_KEY" > /tmp/cache-priv.key
          nix store sign --key-file /tmp/cache-priv.key --recursive ./result
          nix copy --to "s3://nixos-symbiote?endpoint=${{ secrets.R2_ENDPOINT }}&region=auto" ./result
          rm -f /tmp/cache-priv.key

      - name: Invoke activator (triggers soft-reboot)
        timeout-minutes: 15
        run: |
          # Live-tail trace+watchdog to stdout — the only data recoverable
          # if the shell dies before status report.
          sudo tail -F -n 0 /var/log/symbiote/trace.log /var/log/symbiote/watchdog.log &
          TAIL_PID=$!
          trap "sudo kill $TAIL_PID 2>/dev/null || true" EXIT
          echo "=== invoking activator ==="
          sudo ./nixos-symbiote --config test/configuration-minimal.nix
          echo "=== activator returned exit=$? ==="

      - name: Wait for NixOS
        timeout-minutes: 4
        run: |
          set -u
          # Dump cheap sanity info first so we learn SOMETHING even if the
          # system is misbehaving. These don't need systemctl.
          echo "=== static sanity (no systemd needed) ==="
          uname -a || true
          cat /proc/1/comm 2>/dev/null | tr -d '\n'; echo " (pid 1 comm)"
          readlink /proc/1/exe 2>/dev/null | tr -d '\n'; echo " (pid 1 exe)"
          cat /etc/os-release 2>/dev/null || echo "(no /etc/os-release)"
          readlink /sbin/init 2>/dev/null | tr -d '\n'; echo " (sbin/init)"
          ls /nix/store 2>/dev/null | head -3 || echo "(no /nix/store)"
          readlink /run/current-system 2>/dev/null | tr -d '\n'; echo " (current-system)"
          echo "=== dmesg tail (last 60 kernel lines) ==="
          sudo dmesg --nopager 2>/dev/null | tail -60 || true
          echo "=== runner _diag listing ==="
          sudo ls -la /home/runner/runners/*/_diag/ 2>/dev/null | head -20 || echo "(no runner _diag found)"
          echo "=== polling for pivot to NixOS ==="
          # Condition-based wait — no magic numbers. The step timeout bounds us.
          tick=0
          until osid=$(sed -n 's/^ID=//p' /etc/os-release 2>/dev/null) && [ "$osid" = "nixos" ]; do
            tick=$((tick+1))
            pid1_comm=$(cat /proc/1/comm 2>/dev/null)
            pid1_exe=$(readlink /proc/1/exe 2>/dev/null)
            echo "T$tick os=${osid:-unknown} pid1=$pid1_comm exe=$pid1_exe"
            sleep 1
          done
          echo "=== /etc/os-release says NixOS; waiting for systemd ready ==="
          while :; do
            state=$(timeout 10 systemctl is-system-running 2>&1 || echo "UNREACHABLE:$?")
            echo "SYSTEM: $state"
            case "$state" in
              running|degraded) echo "=== OK state=$state ==="; break ;;
            esac
            sleep 1
          done
          systemctl --failed --no-pager || true

      - name: Post-reboot diagnostics
        if: always()
        run: |
          echo "=== system state ==="
          systemctl is-system-running 2>/dev/null || true
          echo "=== /etc/os-release ==="
          cat /etc/os-release 2>/dev/null || true
          echo "=== failed units ==="
          systemctl --failed --no-pager 2>/dev/null || true
          echo "=== list-jobs ==="
          systemctl list-jobs --no-pager 2>/dev/null || true
          echo "=== uname ==="
          uname -a
          echo "=== trace tail ==="
          sudo tail -300 /var/log/symbiote/trace.log 2>/dev/null || echo "no trace"
          echo "=== watchdog tail ==="
          sudo tail -200 /var/log/symbiote/watchdog.log 2>/dev/null || echo "no watchdog"

      - name: Smoke-test (hello runs)
        if: success()
        run: |
          hello
          echo "OS=$(sed -n 's/^ID=//p' /etc/os-release)"
          echo "systemctl=$(systemctl is-system-running 2>&1 || true)"

      - name: Collect diagnostics for upload
        if: always()
        run: |
          sudo mkdir -p /tmp/symbiote-upload
          sudo cp -a /var/log/symbiote /tmp/symbiote-upload/ 2>/dev/null || true
          sudo cp -a /var/log/journal /tmp/symbiote-upload/var-log-journal 2>/dev/null || true
          sudo cp -a /run/log/journal /tmp/symbiote-upload/run-log-journal 2>/dev/null || true
          sudo journalctl --list-boots > /tmp/symbiote-upload/boots.txt 2>&1 || true
          sudo journalctl --no-pager -b -1 > /tmp/symbiote-upload/journal-prev-boot.txt 2>&1 || true
          sudo journalctl --no-pager -b 0  > /tmp/symbiote-upload/journal-this-boot.txt 2>&1 || true
          sudo systemctl list-units --no-pager --all > /tmp/symbiote-upload/units.txt 2>&1 || true
          sudo dmesg --nopager > /tmp/symbiote-upload/dmesg.txt 2>&1 || true
          sudo cp -a /home/runner/runners/*/_diag /tmp/symbiote-upload/runner-diag 2>/dev/null || true
          sudo chmod -R a+r /tmp/symbiote-upload || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.arch }}
          path: /tmp/symbiote-upload/
          if-no-files-found: warn
          retention-days: 7

      - name: Debug via SSH (any non-success)
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 15
        uses: mxschmitt/action-tmate@c0afd6f790e3a5564914980036ebf83216678101 # v3.23
        with:
          limit-access-to-actor: true
