name: Test NixOS Symbiote

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start protected journal logger
        run: |
          sudo systemd-run --unit=journal-logger \
            --property=DefaultDependencies=no \
            --property=IgnoreOnIsolate=yes \
            --property=SurviveFinalKillSignal=yes \
            bash -c 'journalctl -f -o short-monotonic --no-pager > /tmp/journal.log 2>&1'
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
      - name: Build and run nixos-symbiote
        timeout-minutes: 8
        run: |
          nix shell nixpkgs#go -c go build -o nixos-symbiote .
          sudo ./nixos-symbiote --config example/configuration.nix
      - name: Wait for NixOS
        timeout-minutes: 5
        run: |
          for i in $(seq 1 90); do
            state=$(timeout 5 systemctl is-system-running 2>/dev/null || true)
            echo "[$i] $state"
            [ "$state" = "running" ] || [ "$state" = "degraded" ] && exit 0
            sleep 2
          done
          echo "Timed out waiting for system"
          exit 1
      - name: Post-reboot diagnostics
        if: always()
        run: |
          echo "=== system state ==="
          systemctl is-system-running 2>/dev/null || true
          echo "=== failed units ==="
          systemctl --failed --no-pager 2>/dev/null || true
          echo "=== current-system ==="
          readlink /run/current-system 2>/dev/null || echo "missing"
          echo "=== uname ==="
          uname -a
          echo "=== last 100 journal lines ==="
          journalctl --no-pager -n 100 2>/dev/null || true
      - name: Verify NixOS is active
        if: always()
        run: |
          echo "Current system: $(readlink /run/current-system)"
          which psql && which curl
      - name: Run smoke tests
        run: ./example/smoke-test.sh
      - name: Stop journal logger
        if: always()
        run: sudo systemctl stop journal-logger 2>/dev/null || true
      - name: Upload /etc snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: etc-snapshot-${{ matrix.arch }}
          path: /tmp/etc-snapshot.tar.gz
          if-no-files-found: ignore
      - name: Upload journal log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journal-${{ matrix.arch }}
          path: /tmp/journal.log
          if-no-files-found: ignore
      - name: Debug via SSH
        if: failure()
        uses: mxschmitt/action-tmate@c0afd6f790e3a5564914980036ebf83216678101 # v3.23
        with:
          limit-access-to-actor: true
