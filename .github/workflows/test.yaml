name: Test NixOS Symbiote

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Migrate to NixOS
        uses: ./
        with:
          configuration: example/configuration.nix
      - name: Verify NixOS is active
        run: |
          echo "Current system: $(readlink /run/current-system)"
          which psql && which curl
      - name: Run smoke tests
        run: ./example/smoke-test.sh
      - name: Upload /etc snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: etc-snapshot
          path: /tmp/etc-snapshot.tar.gz
          if-no-files-found: ignore
      - name: Debug via SSH
        if: failure()
        uses: mxschmitt/action-tmate@c0afd6f790e3a5564914980036ebf83216678101 # v3.23
        with:
          limit-access-to-actor: true
