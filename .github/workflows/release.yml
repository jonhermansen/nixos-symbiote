name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual run = dry-run: cross-build + stage + upload artifacts, but DO NOT
  # create a GitHub Release. Lets us debug the build/staging in isolation
  # without cutting throwaway tags. A real release only happens on a v* tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            attr: linux-amd64
            asset: nixos-symbiote-linux-amd64
          - runner: ubuntu-26.04-arm
            attr: linux-arm64
            asset: nixos-symbiote-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31

      - name: Build via flake
        run: nix build .#${{ matrix.attr }}

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp result/bin/nixos-symbiote dist/${{ matrix.asset }}
          (cd dist && sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}*
          if-no-files-found: error

  publish:
    needs: build
    # Only publish on an actual v* tag push. A manual workflow_dispatch stops
    # after `build` (artifacts uploaded) — that's the isolated dry-run.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist/
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
