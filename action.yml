name: NixOS Symbiote
description: Activate NixOS on a running systemd system. No reboot.

inputs:
  configuration:
    description: Path to your NixOS configuration.nix
    required: true
  nixpkgs:
    description: Nixpkgs revision — defaults to flake.lock pin if empty
    required: false
    default: ''
  cachix-name:
    description: Cachix cache name (enables binary cache)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
    - name: Setup Cachix
      if: inputs.cachix-name != ''
      uses: cachix/cachix-action@02b16339eddcf6ea27126a830c7f1992855cae13
      with:
        name: ${{ inputs.cachix-name }}
    - name: Activate NixOS
      shell: bash
      # ./activate has a nix-shell shebang for standalone use;
      # here we call with bash since nixpkgs isn't on NIX_PATH
      run: |-
        bash "${{ github.action_path }}/activate" \
          "${{ inputs.configuration }}" \
          "${{ inputs.nixpkgs }}"
