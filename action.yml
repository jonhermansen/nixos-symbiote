name: NixOS Symbiote
description: Activate NixOS on a running systemd system. No reboot.

inputs:
  configuration:
    description: Path to your NixOS configuration.nix
    required: true
  nixpkgs:
    description: Nixpkgs revision — defaults to flake.lock pin if empty
    required: false
    default: ''
  cachix-name:
    description: Cachix cache name (enables binary cache)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
    - name: Setup Cachix
      if: inputs.cachix-name != ''
      uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
      with:
        name: ${{ inputs.cachix-name }}
    - name: Activate NixOS
      shell: bash
      continue-on-error: true
      run: |-
        bash "${{ github.action_path }}/activate" \
          "${{ inputs.configuration }}" \
          "${{ inputs.nixpkgs }}"
    - name: Wait for NixOS
      shell: bash
      run: |-
        timeout 120 systemctl is-system-running --wait || true
        echo "System state: $(timeout 10 systemctl is-system-running 2>&1 || true)"
        timeout 10 systemctl --failed || true
